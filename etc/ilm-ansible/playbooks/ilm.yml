---
- name: Host config
  hosts: all
  connection: local

  pre_tasks:
    - name: Get ILM versions
      ansible.builtin.command: /usr/bin/ilm-versions
      tags: always
      changed_when: false
      register: versions
    - name: ilm versions
      ansible.builtin.debug:
        msg: "{{ versions.stdout }}"
    - name: Assert lowercase hostname
      ansible.builtin.assert:
        that: ansible_fqdn is match("^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$")
        fail_msg: "System hostname, has to be all lowercase, {{ ansible_fqdn }} doesn't match that rule. This is enforced by Kubernetes."
    - name: Check if keycloak file exists
      ansible.builtin.stat:
        path: "/etc/ilm-ansible/vars/keycloak.yml"
      register: keycloak_result
      tags: always
    - name: Generate secret for keycloak
      ansible.builtin.set_fact:
        key_cloak_secret: "{{ lookup('ansible.builtin.password', '/dev/null', chars=['ascii_letters', 'digits']) }}"
      when: not keycloak_result.stat.exists
      tags: always
    - name: Write secret for keycloak
      ansible.builtin.template:
        src: "keycloak.yml.j2"
        dest: "/etc/ilm-ansible/vars/keycloak.yml"
        mode: "0640"
      when: not keycloak_result.stat.exists
      tags: always
    - name: "Read database.yml"
      ansible.builtin.include_vars: /etc/ilm-ansible/vars/database.yml
      tags: always
    - name: "Read docker.yml"
      ansible.builtin.include_vars: /etc/ilm-ansible/vars/docker.yml
      tags: always
    - name: "Read proxy.yml"
      ansible.builtin.include_vars: /etc/ilm-ansible/vars/proxy.yml
      tags: always
    - name: "Read network.yml"
      ansible.builtin.include_vars: /etc/ilm-ansible/vars/network.yml
      tags: always
    - name: "Read ntp.yml"
      ansible.builtin.include_vars: /etc/ilm-ansible/vars/ntp.yml
      tags: always
    - name: "Read ingress.yml"
      ansible.builtin.include_vars: /etc/ilm-ansible/vars/ingress.yml
      tags: always
    - name: "Read trustedCA.yml"
      ansible.builtin.include_vars: /etc/ilm-ansible/vars/trustedCA.yml
      tags: always
    - name: "Read ilm.yml"
      ansible.builtin.include_vars: /etc/ilm-ansible/vars/ilm.yml
      tags: always
    - name: "Read keycloak.yml"
      ansible.builtin.include_vars: /etc/ilm-ansible/vars/keycloak.yml
      tags: always
    - name: "Read email.yml"
      ansible.builtin.include_vars: /etc/ilm-ansible/vars/email.yml
      tags: always

  vars:
    # Here we are preparing dict with environment which is based on
    # configuration. In most cases values of that dict will be
    # undefined, to prevent Ansible from failing we set default value
    # to ''.
    proxy_env:
      http_proxy: "{{ proxy.http | default('') }}"
      HTTP_PROXY: "{{ proxy.http | default('') }}"
      https_proxy: "{{ proxy.https | default('') }}"
      HTTPS_PROXY: "{{ proxy.https | default('') }}"
      ftp_proxy: "{{ proxy.ftp | default('') }}"
      FTP_PROXY: "{{ proxy.ftp | default('') }}"
      ftps_proxy: "{{ proxy.ftps | default('') }}"
      FTPS_PROXY: "{{ proxy.ftps | default('') }}"
      no_proxy: "{{ proxy.dont_use_for | default('') | join(',') }}"
      NO_PROXY: "{{ proxy.dont_use_for | default('') | join(',') }}"
    # by default rke2 role only install kube cfg for root
    custom_kube_cfg_dir:
      - owner: "ilm"
        group: "ilm"
        dir: "/home/ilm/.kube"
    # All CZERTAINLY services are running in parallel and causing big
    # stress on DB, it is better to support more simultaneous connections.
    postgres_max_connections: 250
    # Following vars are used by systemd-timesyncd component
    ntp_servers: "{{ ntp.servers }}"
    system_timezone: "{{ ntp.timezone }}"
    # The helm repository serves several majors at once, so the version has to
    # be decided here instead of taking whatever is newest on build day. It has
    # to match the kubernetes.core collection the package ships, see
    # build-deb.sh: Helm 4 needs at least 6.4.0, and 6.5.0 for the helm module
    # itself. 3.21.3-1 is the last Helm 3 line if this needs to go back.
    helm_version: 4.2.3-1
    # The helm diff plugin, pinned here for the same reason: the helm role
    # carries its own default and moves on with its own life. Only installed
    # when the plugin is missing, so raising this does not move a machine that
    # already has it, "helm plugin uninstall diff" does.
    # Releases: https://github.com/databus23/helm-diff/releases
    helm_diff_version: "3.15.11"
    # Which release of RKE2 (Kubernetes) the appliance installs. Pinned here
    # instead of left to the 'stable' channel, so that the installed version
    # is decided by this package and not by the day a machine is built.
    # Releases: https://github.com/rancher/rke2/releases
    #
    # RKE2 is installed only once, on the first run, and never upgraded
    # afterwards: changing this on an appliance where RKE2 already runs only
    # makes the playbook report that the running version differs from the
    # configured one. Set rke2_allow_upgrade below to upgrade in place, which
    # stops and starts the Kubernetes cluster and cannot be undone, Kubernetes
    # can't be downgraded. Only an exact version can be upgraded to, and jumps
    # over a minor release (e.g. 1.34 -> 1.36) are refused.
    rke2_version: v1.36.2+rke2r1
    # What goes into the cluster next to RKE2 is pinned here as well, so that
    # everything this appliance installs is decided in one place. The rke2 role
    # carries its own defaults for these and moves on with its own life; a
    # submodule bump then changes what a machine would install without the
    # change ever showing up in this package - and unlike RKE2 above, both of
    # these are upgraded in place as soon as the value changes, so it would
    # move existing appliances too, on their next run.
    #
    # Bump these together with the rke2 submodule, the role's defaults are the
    # combination it was tested with. A downgrade and a jump over a minor
    # release are refused for both, minor releases have to be installed one at
    # a time, always the newest patch of each.
    # Releases: https://github.com/cert-manager/cert-manager/releases
    rke2_certmanager_version: v1.21.1
    # Releases: https://github.com/rancher/local-path-provisioner/releases
    rke2_local_path_provisioner_version: v0.0.36
    # The remaining settings of the rke2 role keep the role's defaults, see
    # roles/rke2/defaults/main.yml and the role README. Uncomment to decide
    # them here instead:
    #
    # Channel to install from, used only when rke2_version above is empty.
    # rke2_channel: stable
    # Whether an already installed RKE2 may be upgraded to rke2_version.
    # rke2_allow_upgrade: false
  # Now we filterout those dict keys which have environment valuables
  # which have value equal to ''. This and previous block is need to
  # be able to use HTTP_PROXY and fiends and without playbook/machine
  # restart. Inspiration for filter:
  # https://medium.com/opsops/how-to-filter-a-dictionary-in-ansible-b5dad74a6f66
  environment: '{{ proxy_env|dict2items|rejectattr("value", "equalto", "")|list|items2dict }}'

  roles:
    - role: network
    - role: systemd-timesyncd
      apply:
        tags:
          - ntp
      tags: ntp
      when: ntp is defined
    - role: http-proxy
    - role: postgres
    - role: helm
    - role: rke2
    - role: ilm
