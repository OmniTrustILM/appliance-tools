[defaults]
nocows = 1
inventory = inventory.conf
log_path = /var/log/ansible.log
roles_path = /etc/ilm-ansible/roles
# The appliance ships its own kubernetes.core, see build-deb.sh for why. It
# has to come first, the collections of the distro 'ansible' package are found
# under /usr/lib/python3/dist-packages/ansible_collections in any case, so
# community.postgresql and community.general keep working. ilm-tui exports
# ANSIBLE_CONFIG and sudoers has env_keep for it, so this file is used no
# matter which directory the playbook is started from.
collections_path = /usr/share/ilm-ansible/collections:~/.ansible/collections:/usr/share/ansible/collections
