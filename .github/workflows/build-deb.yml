---
on:
  push:
    branches: [main, master, develop]
  # Manual run from any branch (Actions -> Run workflow) - used on forks to
  # test feature branches; the publisher maps them to the develop dist.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Checkout submodules
        run: git submodule update --init --recursive

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get -y install debhelper dpkg-dev build-essential

      - name: Build package
        run: ./build-deb.sh

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: appliance-tools
          path: ${{ github.workspace }}/*-appliance-tools*.deb

      # POST the .deb to the Debian repository publisher (apps/deb-otilm on
      # the lab10 cluster); it runs reprepro and signs the repository. Branch
      # mapping happens server-side: main/master -> stable, else -> develop.
      # DEB_REPO_HOST must be set as a repository variable (deb.otilm.com on
      # the org repo, the test instance hostname on forks) - no default, so
      # a misconfigured repo fails instead of publishing somewhere unintended.
      - name: Publish package
        env:
          DEB_REPO_HOST: ${{ vars.DEB_REPO_HOST }}
        run: |
          set -e
          if [ -z "$DEB_REPO_HOST" ]; then
            echo "DEB_REPO_HOST repository variable is not set - refusing to publish" >&2
            exit 1
          fi
          deb=$(ls -1 *-appliance-tools*.deb | head -1)
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.DEB_REPO_PUBLISH_TOKEN }}" \
            --data-binary "@${deb}" \
            "https://${DEB_REPO_HOST}/publish?dist=${{ github.ref_name }}&filename=${deb}"
