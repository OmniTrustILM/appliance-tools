---
on:
  push:
    branches: [main, master, develop, 2.19.0]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # The submodules are deliberately not checked out: the check reads
      # .gitmodules, which is a tracked file, and looks the pinned commits up
      # itself. Cloning them first only made the job die before it had
      # anything to say.
      - name: Verify submodules
        env:
          # A pull request runs in the context of the repository it targets,
          # so this is OmniTrustILM for a request into the official repository
          # and the fork's owner for a push to a fork.
          REPO_OWNER: ${{ github.repository_owner }}
        run: ./.github/verify-submodules.sh
